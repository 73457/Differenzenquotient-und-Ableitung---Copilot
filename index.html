<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grafisches Ableiten</title><style>body{font-family:Arial;margin:0;background-image:linear-gradient(#d9d9d9 1px,transparent 1px),linear-gradient(90deg,#d9d9d9 1px,transparent 1px);background-size:5mm 5mm}.top{padding:10px;text-align:center}.board{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:10px}.tile{background:#FFE066;aspect-ratio:1;border:2px solid #999;position:relative}.tile canvas{width:100%;height:100%}.selected{outline:4px solid #003366}.correct{background:#6BCB77}.wrong{background:#FF6B6B}</style></head><body><div class="top"><h2>Grafisches Ableiten</h2><div id="stats">Gefundene Paare: 0 / 12 | Fehlversuche: 0</div><button onclick="location.reload()">Neues Spiel</button></div><div id="board" class="board"></div><script>const defs=[['p1','f',x=>0.5*x*x-2],['p1','d',x=>x],['p2','f',x=>-x*x+2*x+2],['p2','d',x=>-2*x+2],['p3','f',x=>x*x*x-3*x],['p3','d',x=>3*x*x-3],['p4','f',x=>-(x*x*x)/3+x+1],['p4','d',x=>-x*x+1],['p5','f',x=>0.25*x**4-x*x],['p5','d',x=>x**3-2*x],['p6','f',x=>-0.5*x+1],['p6','d',x=>-0.5],['p7','f',x=>0.5*(x-1)**3+1],['p7','d',x=>1.5*(x-1)**2],['p8','f',x=>Math.exp(0.5*x)],['p8','d',x=>0.5*Math.exp(0.5*x)],['p9','f',x=>2-Math.exp(-x)],['p9','d',x=>Math.exp(-x)],['p10','f',x=>2*Math.sin(x)],['p10','d',x=>2*Math.cos(x)],['p11','f',x=>Math.cos(2*x)+1],['p11','d',x=>-2*Math.sin(2*x)],['p12','f',x=>Math.sin(x)+0.5*x],['p12','d',x=>Math.cos(x)+0.5],['dist','g',x=>0.5*x*x+x-1]];let items=defs.map((d,i)=>({pair:d[0],role:d[1],fn:d[2],id:i}));for(let i=items.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]];}const board=document.getElementById('board');let sel=null,err=0,found=0,lock=false;function upd(){stats.textContent=`Gefundene Paare: ${found} / 12 | Fehlversuche: ${err}`;}items.forEach((it,idx)=>{let div=document.createElement('div');div.className='tile';div.tabIndex=0;let c=document.createElement('canvas');c.width=220;c.height=220;div.appendChild(c);draw(c,it.fn);div.onclick=()=>pick(it,div);board.appendChild(div);it.el=div;});function pick(a,el){if(lock||el.classList.contains('correct'))return;if(sel&&sel.el===el){el.classList.remove('selected');sel=null;return;}if(!sel){sel={a,el};el.classList.add('selected');return;}let b=sel.a,el2=sel.el;el2.classList.remove('selected');if(a.pair===b.pair&&a.role!==b.role&&a.pair!=='dist'){el.classList.add('correct');el2.classList.add('correct');found++;upd();if(found===12)alert('Geschafft!');}else{err++;upd();lock=true;el.classList.add('wrong');el2.classList.add('wrong');setTimeout(()=>{el.classList.remove('wrong');el2.classList.remove('wrong');lock=false;},1000);}sel=null;}function draw(c,f){const x=c.getContext('2d'),w=c.width,h=c.height;x.clearRect(0,0,w,h);x.strokeStyle='#999';for(let i=0;i<=8;i++){let p=i*w/8;x.beginPath();x.moveTo(p,0);x.lineTo(p,h);x.stroke();x.beginPath();x.moveTo(0,p);x.lineTo(w,p);x.stroke();}const tx=v=>(v+4)/8*w, ty=v=>h-(v+4)/8*h;x.strokeStyle='black';x.beginPath();x.moveTo(tx(-4),ty(0));x.lineTo(tx(4),ty(0));x.stroke();x.beginPath();x.moveTo(tx(0),ty(-4));x.lineTo(tx(0),ty(4));x.stroke();x.strokeStyle='#0b3d91';x.lineWidth=2.5;x.beginPath();for(let i=0;i<=400;i++){let xx=-4+8*i/400,yy=f(xx),cx=tx(xx),cy=ty(Math.max(-4,Math.min(4,yy)));if(i===0)x.moveTo(cx,cy);else x.lineTo(cx,cy);}x.stroke();}</script></body></html>
